<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Memory Tiles</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171a2b; --accent:#6cf; --win:#20c997; --text:#e8ecf1;
    --card:#1e2238; --card-face:#2a3050; --gap:10px; --radius:12px; --shadow:0 6px 16px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial;
    background:radial-gradient(1200px 800px at 70% -10%, #192042 0%, #0f1220 60%);
    color:var(--text); display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .wrap{width:min(1080px,100%); display:grid; grid-template-columns: 280px 1fr; gap:16px}
  @media (max-width:860px){ .wrap{grid-template-columns:1fr; } }
  .panel{ background:var(--panel); border-radius:16px; box-shadow:var(--shadow); padding:16px 16px 12px; }
  h1{font-size:20px; margin:0 0 10px; color:#d9efff}
  .row{display:flex; gap:10px; align-items:center; margin:8px 0}
  label{font-size:14px; color:#b8c2d6}
  select,button{
    background:#1b2238; color:var(--text); border:1px solid #2d365c; border-radius:10px;
    padding:8px 10px; font:inherit; cursor:pointer;
  }
  button.primary{background:var(--accent); color:#00111a; border:none}
  .stats{display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin:10px 0}
  .stat{background:#10142a; padding:10px; border-radius:10px; text-align:center; border:1px solid #242c4a}
  .stat b{display:block; font-size:12px; color:#a9b6d3}
  .stat span{display:block; font-size:20px; margin-top:2px}
  .stat.turn{outline:2px solid var(--accent)}
  .a11y{font-size:13px; color:#9db0d9}
  .board{
    background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
    padding:12px; display:grid; gap:var(--gap); align-content:start; min-height:420px;
  }
  .card{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:var(--radius);
    transform-style:preserve-3d; transition:transform .28s cubic-bezier(.2,.7,.2,1);
    user-select:none; outline:none; border:1px solid #273154;
    background:linear-gradient(180deg, #1a2142 0%, #141a34 100%);
  }
  .card[aria-pressed="true"]{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius); backface-visibility:hidden;
  }
  .back{background:var(--card); color:#9dc6ff; font-weight:700}
  .front{background:var(--card-face); transform:rotateY(180deg); font-size:clamp(18px,5vmin,48px)}
  .front img{width:70%; height:70%; object-fit:contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35));}
  .card.matched{ border-color:#2bd; box-shadow:0 0 0 2px #2bd55a inset; }
  .card:focus-visible{box-shadow:0 0 0 3px #9df}
  dialog{
    border:none; border-radius:16px; padding:18px; background:#12172e; color:var(--text);
    box-shadow:var(--shadow); width:min(420px,92%);
  }
  dialog::backdrop{background:rgba(5,8,20,.6)}
  .win{border-left:4px solid var(--win)}
  .best{font-size:13px; color:#a8bad9}
  @media (prefers-reduced-motion: reduce){ .card{transition:none} }

    /* Thai theme overrides */
  body.theme-thai{
    --bg:#0e0a1a; --panel:#1a1328; --accent:#f0c419; --text:#fff7e1;
    --card:#221639; --card-face:#2c1e4f;
    background-image: linear-gradient(rgba(14,10,26,0.55), rgba(14,10,26,0.55)), url('assets/backgrounds_png/thai.png');
    background-size: cover, cover; background-position: center, center; background-repeat: no-repeat, no-repeat;
  }


    /* Dinosaur theme overrides */
  body.theme-dinosaur{
    --bg:#0e1412; --panel:#16211e; --accent:#7bd88f; --text:#e8fff1;
    --card:#1b2a22; --card-face:#23372c;
    background-image: linear-gradient(rgba(14,20,18,0.5), rgba(14,20,18,0.5)), url('assets/backgrounds_png/dinosaur.png');
    background-size: cover, cover; background-position: center, center; background-repeat: no-repeat, no-repeat;
  }

</style>
</head>
<body>
  <div class="wrap">
    <aside class="panel">
      <h1>Memory Tiles</h1>

      <div class="row">
        <label for="size">Board</label>
        <select id="size" aria-label="Board size">
          <option value="4x4">4 × 4</option>
          <option value="5x4">5 × 4</option>
          <option value="6x4">6 × 4</option>
          <option value="6x5">6 × 5</option>
          <option value="6x6">6 × 6</option>
          <option value="7x6">7 × 6</option>
          <option value="8x6">8 × 6</option>
          <option value="8x8">8 × 8</option>
          <option value="9x8">9 × 8</option>
          <option value="10x8">10 × 8</option>
          <option value="10x10">10 × 10</option>
        </select>
      </div>

      <div class="row">
        <label for="theme">Symbols</label>
        <select id="theme" aria-label="Symbol theme">
          <option value="classic">Classic</option>
          <option value="animals">Animals</option>
          <option value="foods">Foods</option>
          <option value="shapes">Shapes</option>
          <option value="thai" selected>Thai</option>
          <option value="dinosaur">Dinosaur</option>
        </select>
      </div>

      <div class="row">
        <label for="mode">Mode</label>
        <select id="mode" aria-label="Game mode">
          <option value="solo">Solo</option>
          <option value="p2">2 players (hot-seat)</option>
        </select>
      </div>

      <div class="stats">
        <div class="stat"><b>Moves</b><span id="moves">0</span></div>
        <div class="stat"><b>Time</b><span id="time">00:00</span></div>
      </div>

      <div class="stats" id="pstats" style="display:none">
        <div class="stat" id="p1wrap"><b>Player 1</b><span id="p1">0</span></div>
        <div class="stat" id="p2wrap"><b>Player 2</b><span id="p2">0</span></div>
      </div>

      <div class="row">
        <button id="restart" class="grow">Restart</button>
        <button id="new" class="primary">New Game</button>
      </div>
      <div class="row">
        <span class="best" id="bestLabel">Best: —</span>
      </div>
      <div class="row a11y">
        Keyboard: arrows to move, Enter/Space to flip. Screen reader updates live.
      </div>
      <div aria-live="polite" aria-atomic="true" class="sr" id="live" style="position:absolute;left:-9999px"></div>
    </aside>

    <main class="board panel" id="board" aria-label="Memory board"></main>
  </div>

  <dialog id="modal" class="win">
    <h2>Nice. You matched all cards.</h2>
    <p id="summary"></p>
    <div style="display:flex; gap:10px; margin-top:8px">
      <button id="again" class="primary">Play again</button>
      <button id="close">Close</button>
    </div>
  </dialog>

  <!-- Simple sounds -->
  <audio id="sflip" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" preload="auto"></audio>
  <audio id="smatch" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" preload="auto"></audio>
  <audio id="sno" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg" preload="auto"></audio>
  <audio id="svictory" src="https://actions.google.com/sounds/v1/cartoon/concussive_drum_hit.ogg" preload="auto"></audio>

<script>
(() => {
  'use strict';

  const $ = sel => document.querySelector(sel);
  const pad = n => String(n).padStart(2,'0');
  const choice = arr => arr[Math.floor(Math.random()*arr.length)];
  const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]];} return a; };
  const now = () => performance.now();

  const THEMES = {
    classic: ['★','❤','◆','☀','☂','♞','♣','♠','♫','✿','⚽','⚡','☕','⚓','⌛','✈','🔑','💎','📌','🎲','🧩','🪐','🧪','🔧','🧭','🛰','🛸','🚀','🏆','🎯'],
    animals: ['🐶','🐱','🦊','🐼','🐵','🦁','🐯','🐸','🐨','🐷','🐙','🦉','🦋','🐝','🐢','🦄','🦓','🐰','🦒','🐞','🐺','🐠','🦀','🐘','🦜','🐳','🦔','🐍','🦕','🦖'],
    foods:   ['🍎','🍌','🍇','🍉','🍑','🍓','🍒','🥝','🥑','🍍','🍔','🍕','🌮','🍣','🍪','🍩','🍰','🧁','🍫','🥨','🥗','🍤','🥞','🍜','🥟','🧀','🌭','🍙','🍧','🍟'],
    shapes:  ['⭕','🔺','🔻','🔷','🔶','⬛','⬜','🟣','🟩','🟥','🟨','🔳','🔲','◀','▶','⏺','⏹','⏫','⏬','⏩','⏪','✳','✴','▪','▫','◼','◻','◾','◽','❇'],
    thai: [
      'img:assets/tiles_png/thai/chili.png','img:assets/tiles_png/thai/boat.png','img:assets/tiles_png/thai/tomyum.png','img:assets/tiles_png/thai/temple.png','img:assets/tiles_png/thai/sala.png','img:assets/tiles_png/thai/elephant.png','img:assets/tiles_png/thai/durian.png','img:assets/tiles_png/thai/krathong.png','img:assets/tiles_png/thai/orchid.png','img:assets/tiles_png/thai/coconut.png','img:assets/tiles_png/thai/padthai.png','img:assets/tiles_png/thai/mango.png','img:assets/tiles_png/thai/padkrapao.png','img:assets/tiles_png/thai/umbrella.png','img:assets/tiles_png/thai/mangostickyrice.png','img:assets/tiles_png/thai/thaitea.png','img:assets/tiles_png/thai/tuktuk.png','img:assets/tiles_png/thai/ricebowl.png','img:assets/tiles_png/thai/palm.png','img:assets/tiles_png/thai/buddha.png','img:assets/tiles_png/thai/naga.png','img:assets/tiles_png/thai/drum.png','img:assets/tiles_png/thai/lotus.png','img:assets/tiles_png/thai/khonmask.png','img:assets/tiles_png/thai/rooster.png','img:assets/tiles_png/thai/bananaleaf.png','img:assets/tiles_png/thai/somtam.png'
    ],
    dinosaur: [
      'img:assets/tiles_png/dinosaur/iguanodon.png','img:assets/tiles_png/dinosaur/footprint.png','img:assets/tiles_png/dinosaur/dilophosaurus.png','img:assets/tiles_png/dinosaur/parasaurolophus.png','img:assets/tiles_png/dinosaur/stegosaurus.png','img:assets/tiles_png/dinosaur/apatosaurus.png','img:assets/tiles_png/dinosaur/archaeopteryx.png','img:assets/tiles_png/dinosaur/ankylosaurus.png','img:assets/tiles_png/dinosaur/spinosaurus.png','img:assets/tiles_png/dinosaur/trex.png','img:assets/tiles_png/dinosaur/pachycephalosaurus.png','img:assets/tiles_png/dinosaur/raptor.png','img:assets/tiles_png/dinosaur/pterodactyl.png','img:assets/tiles_png/dinosaur/mosasaurus.png','img:assets/tiles_png/dinosaur/coelophysis.png','img:assets/tiles_png/dinosaur/ceratosaurus.png','img:assets/tiles_png/dinosaur/therizinosaurus.png','img:assets/tiles_png/dinosaur/allosaurus.png','img:assets/tiles_png/dinosaur/brachiosaurus.png','img:assets/tiles_png/dinosaur/egg.png','img:assets/tiles_png/dinosaur/protoceratops.png','img:assets/tiles_png/dinosaur/carnotaurus.png','img:assets/tiles_png/dinosaur/giganotosaurus.png','img:assets/tiles_png/dinosaur/triceratops.png'
    ]
  };

  let rows=4, cols=4, first=null, lock=false, moves=0, matches=0;
  let started=false, startTime=0, rafId=0, totalPairs=8;
  let players=1, current=0, scores=[0,0];

  const board = $('#board'), timeEl = $('#time'), movesEl = $('#moves');
  const sizeSel = $('#size'), themeSel = $('#theme'), modeSel = $('#mode');

  function applyThemeVisuals(){
    document.body.classList.toggle('theme-thai', themeSel.value==='thai');
    document.body.classList.toggle('theme-dinosaur', themeSel.value==='dinosaur');
  }
  const live = $('#live'), modal = $('#modal'), summary = $('#summary');
  const bestLabel = $('#bestLabel');
  const pstats = $('#pstats'), p1El = $('#p1'), p2El = $('#p2');
  const p1wrap = $('#p1wrap'), p2wrap = $('#p2wrap');

  const sflip=$('#sflip'), smatch=$('#smatch'), sno=$('#sno'), svictory=$('#svictory');

  function startTimer(){ if(started) return; started = true; startTime = now(); tick(); }
  function stopTimer(){ cancelAnimationFrame(rafId); started = false; }
  function tick(){
    const s = Math.floor((now()-startTime)/1000);
    timeEl.textContent = `${pad((s/60)|0)}:${pad(s%60)}`;
    rafId = requestAnimationFrame(tick);
  }

  function bestKey(){ return `mem-best-${rows}x${cols}`; }
  function loadBest(){
    const v = localStorage.getItem(bestKey());
    bestLabel.textContent = v ? `Best: ${v}` : 'Best: —';
  }
  function maybeSetBest(){
    const cur = timeEl.textContent, prev = localStorage.getItem(bestKey());
    const toS = t => { const [m,s]=t.split(':').map(Number); return m*60+s; };
    if(!prev || toS(cur)<toS(prev)){ localStorage.setItem(bestKey(), cur); loadBest(); return true; }
    return false;
  }

  function computeGrid(){
    const [c,r] = sizeSel.value.split('x').map(Number);
    cols = c; rows = r;
    totalPairs = (rows*cols)/2;
    board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    board.style.setProperty('--gap', cols>=8 ? '6px' : '10px');
  }

  function deal(){
    board.innerHTML = '';
    first=null; lock=false; moves=0; matches=0;
    movesEl.textContent='0'; timeEl.textContent='00:00';
    stopTimer(); started=false;

    computeGrid();
    applyThemeVisuals();

    players = modeSel.value==='p2' ? 2 : 1;
    current = 0; scores=[0,0];
    if(players===2){
      pstats.style.display='grid';
      p1El.textContent='0'; p2El.textContent='0';
      bestLabel.textContent = 'Hot-seat: P1 vs P2';
    }else{
      pstats.style.display='none';
      loadBest();
    }
    updateTurnUI();

    // symbol pool large enough for up to 100 tiles (50 pairs)
    let base = [...THEMES[themeSel.value]];
    if(base.length < totalPairs){
      const union = [...new Set([...THEMES.classic, ...THEMES.animals, ...THEMES.foods, ...THEMES.shapes])];
      for(const s of union){ if(base.length>=totalPairs) break; if(!base.includes(s)) base.push(s); }
    }
    const picks = shuffle(base).slice(0, totalPairs);
    const deck = shuffle([...picks, ...picks]);

    deck.forEach((sym, i) => {
      const card = document.createElement('button');
      card.className = 'card';
      card.type='button';
      card.setAttribute('aria-pressed','false');
      card.setAttribute('aria-label','Hidden card');
      card.dataset.index = i;
      if(typeof sym === 'string' && sym.startsWith('img:')){
        const src = sym.slice(4);
        const base = src.split('/').pop().replace(/\.[a-zA-Z0-9]+$/, '');
        card.dataset.symbol = base;
        card.innerHTML = `
          <div class="face back">?</div>
          <div class="face front" aria-hidden="true"><img src="${src}" alt=""></div>
        `;
      }else{
        card.dataset.symbol = sym;
        card.innerHTML = `
          <div class="face back">?</div>
          <div class="face front" aria-hidden="true">${sym}</div>
        `;
      }
      card.addEventListener('click', () => flip(card));
      card.addEventListener('keydown', e => onKey(e, card));
      board.appendChild(card);
    });
  }

  function onKey(e, card){
    const i = Number(card.dataset.index);
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); card.click(); return; }
    const max = rows*cols - 1;
    let t = i;
    if(e.key === 'ArrowRight') t = Math.min(i+1, Math.floor(i/cols)*cols + (cols-1));
    else if(e.key === 'ArrowLeft') t = Math.max(i-1, Math.floor(i/cols)*cols);
    else if(e.key === 'ArrowDown') t = Math.min(i+cols, max);
    else if(e.key === 'ArrowUp') t = Math.max(i-cols, 0);
    if(t !== i){ getCard(t).focus(); }
  }

  function updateTurnUI(){
    if(players!==2){ p1wrap.classList.remove('turn'); p2wrap.classList.remove('turn'); return; }
    p1wrap.classList.toggle('turn', current===0);
    p2wrap.classList.toggle('turn', current===1);
    live.textContent = `Player ${current+1}'s turn`;
  }

  function getCard(idx){ return board.querySelector(`.card[data-index="${idx}"]`); }

  function flip(card){
    if(lock) return;
    if(card.classList.contains('matched')) return;
    const pressed = card.getAttribute('aria-pressed') === 'true';
    if(pressed) return;

    startTimer();
    card.setAttribute('aria-pressed','true');
    if(sflip){ try{sflip.currentTime=0; sflip.play();}catch(e){} }

    if(!first){
      first = card;
      live.textContent = 'First card flipped';
      return;
    }
    moves++; movesEl.textContent = String(moves);

    if(first.dataset.symbol === card.dataset.symbol){
      first.classList.add('matched');
      card.classList.add('matched');
      const label = card.dataset.symbol.replace(/[-_]/g,' ');
      first.setAttribute('aria-label', `Matched ${label}`);
      card.setAttribute('aria-label', `Matched ${label}`);
      first = null;
      matches++;
      if(smatch){ try{smatch.currentTime=0; smatch.play();}catch(e){} }
      if(players===2){
        scores[current]++; (current===0 ? p1El : p2El).textContent = String(scores[current]);
        live.textContent = `Player ${current+1} scores`;
      }else{
        live.textContent = 'Match';
      }
      if(matches === totalPairs){ onWin(); }
    }else{
      lock = true;
      if(sno){ try{sno.currentTime=0; sno.play();}catch(e){} }
      live.textContent = players===2 ? `No match. Switching to Player ${((current+1)%2)+1}` : 'No match';
      const a=first, b=card;
      setTimeout(() => {
        a.setAttribute('aria-pressed','false');
        b.setAttribute('aria-pressed','false');
        first=null; lock=false;
        if(players===2){ current = (current+1)%2; updateTurnUI(); }
      }, 650);
    }
  }

  function onWin(){
    stopTimer();
    const t = timeEl.textContent;
    if(players===2){
      const [s1,s2] = scores;
      const verdict = s1===s2 ? 'Tie' : (s1>s2 ? 'Player 1 wins' : 'Player 2 wins');
      summary.textContent = `${verdict}. P1 ${s1} – P2 ${s2}. Time ${t}, Moves ${moves}.`;
    }else{
      const improved = maybeSetBest();
      summary.textContent = `Time ${t}, Moves ${moves}.` + (improved ? ' New best.' : '');
    }
    if(svictory){ try{svictory.currentTime=0; svictory.play();}catch(e){} }
    modal.showModal();
  }

  $('#restart').addEventListener('click', () => deal());
  $('#new').addEventListener('click', () => { deal(); });
  $('#again').addEventListener('click', () => { modal.close(); deal(); });
  $('#close').addEventListener('click', () => modal.close());
  sizeSel.addEventListener('change', () => deal());
  themeSel.addEventListener('change', () => deal());
  modeSel.addEventListener('change', () => deal());

  deal();
})();
</script>
</body>
</html>
